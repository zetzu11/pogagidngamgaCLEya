<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TA NGA CLE</title>
<style>
:root{--bg:#10131b;--panel:#191e29;--panel2:#202737;--text:#eef2ff;--muted:#9ba7bd;--accent:#8b7cff;--line:#354056;--curve:#64d6ff;--point:#ffca6a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0}header span{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:16px;max-width:1500px;margin:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.controls{display:flex;flex-direction:column;gap:15px}
label{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
select,button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font:inherit}
select{width:100%}button{cursor:pointer}button:hover{border-color:var(--accent)}
.segment{display:flex;gap:7px}.segment button{flex:1}.segment button.active{background:#39315f;border-color:var(--accent);color:#fff}
.small{font-size:12px;color:var(--muted)}
.readout{background:#111722;border:1px solid var(--line);border-radius:10px;padding:12px}
.eq{font:600 18px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;color:#a9e8ff;min-height:55px}
.points{display:flex;flex-direction:column;gap:8px}.pointrow{display:flex;justify-content:space-between;gap:10px;font-size:13px}.pointrow b{color:var(--point);font-weight:600}
.actions{display:flex;gap:8px}.actions button{flex:1}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.graphwrap{background:#0d1119;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:min(70vh,700px);min-height:430px;touch-action:none;cursor:crosshair}
.gridline{stroke:#263044;stroke-width:1}.axis{stroke:#aab5c8;stroke-width:1.5}.ticktext{fill:#8491a8;font-size:11px}
.curve{fill:none;stroke:var(--curve);stroke-width:2.7;vector-effect:non-scaling-stroke}
.asymptote{stroke:#e0b56c;stroke-width:1.4;stroke-dasharray:7 6;opacity:.85;vector-effect:non-scaling-stroke}
.handle{fill:var(--point);stroke:#111722;stroke-width:2.5;cursor:grab;vector-effect:non-scaling-stroke}
.handle:active{cursor:grabbing}.center{fill:#85e0a5}
.graphhint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:0 3px}
@media(max-width:850px){main{grid-template-columns:1fr}svg{height:55vh;min-height:380px}}
</style>
</head>
<body>
<header><div><h1>MAMAMAA</h1><span>RENEE</span></div><span>HTML · CSS · JavaScript</span></header>
<main>
<aside class="panel controls">
  <div><label for="shape">Cchatgpt x seth</label><select id="shape"><option value="circle">Circle</option><option value="parabola">Parabola</option><option value="ellipse">Ellipse</option><option value="hyperbola">Hyperbola</option><option value="line">Line</option></select></div>
  <div id="orientationBox"><label>Opening / major axis</label><div class="segment"><button id="horizontal" class="active">Higda</button><button id="vertical">tindog</button></div></div>
  <div class="readout"><label>Standard-form equation</label><div class="eq" id="equation">x² + y² = 25</div><div class="small" id="equationNote">Drag the yellow points to change the graph.</div></div>
  <div><label>Draggable points</label><div class="points" id="pointList"></div></div>
  <div class="actions"><button id="reset">Reset shape</button><button id="copy">kopyaha</button></div>
  <div class="small">Tip: Drag the yellow handles on the graph. Use the mouse wheel to zoom and drag the empty graph area to pan.</div>
</aside>
<section class="stage">
  <div class="graphwrap"><svg id="graph" viewBox="0 0 900 620" aria-label="Interactive coordinate plane"></svg></div>
  <div class="graphhint"><span id="scaleLabel">Grid: 1 unit per major interval</span><span>Yellow = draggable point · Blue = graph · Gold = asymptote</span></div>
</section>
</main>
<script>
(() => {
const svg=document.getElementById('graph'), shapeEl=document.getElementById('shape'), eqEl=document.getElementById('equation');
const listEl=document.getElementById('pointList'), noteEl=document.getElementById('equationNote');
const W=900,H=620, baseScale=32;
let scale=baseScale, ox=W/2, oy=H/2, orientation='horizontal', dragging=null, panning=null;
let state, initial;
const clone=o=>JSON.parse(JSON.stringify(o));
const defaults={
 circle:{h:0,k:0,r:5},
 parabola:{h:0,k:0,p:2},
 ellipse:{h:0,k:0,a:6,b:3},
 hyperbola:{h:0,k:0,a:4,b:3},
 line:{x1:-4,y1:-2,x2:4,y2:2}
};
function reset(){state=clone(defaults[shapeEl.value]);orientation='horizontal';updateButtons();render()}
function updateButtons(){document.getElementById('horizontal').classList.toggle('active',orientation==='horizontal');document.getElementById('vertical').classList.toggle('active',orientation==='vertical');}
function fmt(n){if(Math.abs(n)<1e-8)n=0;return Number(n.toFixed(2)).toString()}
function sq(n){return Math.abs(n-1)<1e-8?'':fmt(n)}
function denom(n){return fmt(n*n)}
function coord(v){return v<0?'('+fmt(v)+')':fmt(v)}
function equation(){
 const s=state, o=orientation, h=fmt(s.h||0), k=fmt(s.k||0), X=s.h===0?'x':`(x ${s.h<0?'+':'−'} ${fmt(Math.abs(s.h))})`, Y=s.k===0?'y':`(y ${s.k<0?'+':'−'} ${fmt(Math.abs(s.k))})`;
 let eq='', note='';
 if(shapeEl.value==='circle'){eq=`${X}² + ${Y}² = ${denom(s.r)}`;note=`Center (${h}, ${k}) · Radius ${fmt(s.r)}`}
 if(shapeEl.value==='ellipse'){
   let a2=denom(s.a),b2=denom(s.b);
   eq=o==='horizontal'?`${X}²/${a2} + ${Y}²/${b2} = 1`:`${X}²/${b2} + ${Y}²/${a2} = 1`;
   note=`Center (${h}, ${k}) · Semi-major axis ${fmt(s.a)} · Semi-minor axis ${fmt(s.b)}`;
 }
 if(shapeEl.value==='hyperbola'){
   let a2=denom(s.a),b2=denom(s.b);
   eq=o==='horizontal'?`${X}²/${a2} − ${Y}²/${b2} = 1`:`${Y}²/${a2} − ${X}²/${b2} = 1`;
   note=`Center (${h}, ${k}) · a = ${fmt(s.a)} · b = ${fmt(s.b)} · Asymptotes shown in gold`;
 }
 if(shapeEl.value==='parabola'){
   eq=o==='horizontal'?`${Y} = ${fmt(1/(4*s.p))} ${X}²`:`${X} = ${fmt(1/(4*s.p))} ${Y}²`;
   // More conventional vertex form with signed coefficient.
   const c=1/(4*s.p);
   eq=o==='horizontal'?`${Y} = ${fmt(c)}${X}²`:`${X} = ${fmt(c)}${Y}²`;
   note=`Vertex (${h}, ${k}) · Focus ${o==='horizontal'?`(${fmt(s.h+s.p)}, ${k})`:`(${h}, ${fmt(s.k+s.p)})`} · p = ${fmt(s.p)}`;
 }
 if(shapeEl.value==='line'){
   const dx=s.x2-s.x1,dy=s.y2-s.y1;
   if(Math.abs(dx)<1e-6)eq=`x = ${fmt(s.x1)}`;
   else if(Math.abs(dy)<1e-6)eq=`y = ${fmt(s.y1)}`;
   else {let m=dy/dx,b=s.y1-m*s.x1;eq=`y = ${fmt(m)}x ${b<0?'−':'+'} ${fmt(Math.abs(b))}`;}
   note=`Point A (${fmt(s.x1)}, ${fmt(s.y1)}) · Point B (${fmt(s.x2)}, ${fmt(s.y2)})`;
 }
 return {eq,note};
}
function worldToScreen(x,y){return [ox+x*scale,oy-y*scale]}
function screenToWorld(x,y){return [(x-ox)/scale,(oy-y)/scale]}
function el(tag,attrs={},parent=svg){let n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let k in attrs)n.setAttribute(k,attrs[k]);parent.appendChild(n);return n}
function pathFrom(fn,t0,t1,steps=500){let d='';for(let i=0;i<=steps;i++){let t=t0+(t1-t0)*i/steps,[x,y]=fn(t),[sx,sy]=worldToScreen(x,y);d+=(i?'L':'M')+sx.toFixed(2)+' '+sy.toFixed(2)+' ';}return d}
function drawGrid(){
 const unit=scale, left=(0-ox)/unit,right=(W-ox)/unit,bottom=(oy-H)/unit,top=oy/unit;
 for(let x=Math.ceil(left);x<=right;x++){let [sx]=worldToScreen(x,0);el('line',{x1:sx,y1:0,x2:sx,y2:H,class:'gridline'});if(x!==0&&x%Math.max(1,Math.round(80/scale))===0)el('text',{x:sx+4,y:oy+15,class:'ticktext'}).textContent=x;}
 for(let y=Math.ceil(bottom);y<=top;y++){let [,sy]=worldToScreen(0,y);el('line',{x1:0,y1:sy,x2:W,y2:sy,class:'gridline'});if(y!==0&&y%Math.max(1,Math.round(80/scale))===0)el('text',{x:ox+5,y:sy-4,class:'ticktext'}).textContent=y;}
 el('line',{x1:0,y1:oy,x2:W,y2:oy,class:'axis'});el('line',{x1:ox,y1:0,x2:ox,y2:H,class:'axis'});
 el('text',{x:W-18,y:oy-8,class:'ticktext'}).textContent='x';el('text',{x:ox+8,y:15,class:'ticktext'}).textContent='y';el('text',{x:ox+6,y:oy+14,class:'ticktext'}).textContent='0';
}
function drawCurve(){
 const s=state,o=orientation, bounds=[-45,45];
 const add=(fn)=>el('path',{d:pathFrom(fn,-45,45),class:'curve'});
 if(shapeEl.value==='circle')add(t=>[s.h+s.r*Math.cos(t),s.k+s.r*Math.sin(t)]);
 if(shapeEl.value==='ellipse')add(t=>o==='horizontal'?[s.h+s.a*Math.cos(t),s.k+s.b*Math.sin(t)]:[s.h+s.b*Math.cos(t),s.k+s.a*Math.sin(t)]);
 if(shapeEl.value==='parabola'){
   const c=1/(4*s.p);
   add(t=>o==='horizontal'?[s.h+s.p*t*t,s.k+t]:[s.h+t,s.k+s.p*t*t]);
 }
 if(shapeEl.value==='hyperbola'){
   const a=s.a,b=s.b;
   if(o==='horizontal'){
     for(let sign of [-1,1])el('path',{d:pathFrom(t=>[s.h+sign*a*Math.cosh(t),s.k+b*Math.sinh(t)],-3.5,3.5),class:'curve'});
     for(let sign of [-1,1])el('line',{x1:worldToScreen(s.h-20,s.k-sign*20*b/a)[0],y1:worldToScreen(s.h-20,s.k-sign*20*b/a)[1],x2:worldToScreen(s.h+20,s.k+sign*20*b/a)[0],y2:worldToScreen(s.h+20,s.k+sign*20*b/a)[1],class:'asymptote'});
   }else{
     for(let sign of [-1,1])el('path',{d:pathFrom(t=>[s.h+b*Math.sinh(t),s.k+sign*a*Math.cosh(t)],-3.5,3.5),class:'curve'});
     for(let sign of [-1,1])el('line',{x1:worldToScreen(s.h-20,s.k- sign*20*a/b)[0],y1:worldToScreen(s.h-20,s.k- sign*20*a/b)[1],x2:worldToScreen(s.h+20,s.k+sign*20*a/b)[0],y2:worldToScreen(s.h+20,s.k+sign*20*a/b)[1],class:'asymptote'});
   }
 }
 if(shapeEl.value==='line'){
   const dx=s.x2-s.x1,dy=s.y2-s.y1,len=100;
   const mag=Math.hypot(dx,dy)||1,ux=dx/mag,uy=dy/mag;
   el('path',{d:pathFrom(t=>[s.x1+ux*t,s.y1+uy*t],-len,len),class:'curve'});
 }
}
function handles(){
 const s=state, pts=[];
 if(shapeEl.value==='circle'){pts.push(['Center',s.h,s.k,'center'],['Radius',s.h+s.r,s.k]);}
 if(shapeEl.value==='ellipse'){
   pts.push(['Center',s.h,s.k,'center']);
   pts.push(orientation==='horizontal'?['Major axis',s.h+s.a,s.k]:['Major axis',s.h,s.k+s.a]);
   pts.push(orientation==='horizontal'?['Minor axis',s.h,s.k+s.b]:['Minor axis',s.h+s.b,s.k]);
 }
 if(shapeEl.value==='hyperbola'){
   pts.push(['Center',s.h,s.k,'center']);
   pts.push(orientation==='horizontal'?['Vertex',s.h+s.a,s.k]:['Vertex',s.h,s.k+s.a]);
   pts.push(orientation==='horizontal'?['Conjugate axis',s.h,s.k+s.b]:['Conjugate axis',s.h+s.b,s.k]);
 }
 if(shapeEl.value==='parabola'){
   pts.push(['Vertex',s.h,s.k,'center']);
   pts.push(orientation==='horizontal'?['Focus',s.h+s.p,s.k]:['Focus',s.h,s.k+s.p]);
 }
 if(shapeEl.value==='line'){pts.push(['Point A',s.x1,s.y1],['Point B',s.x2,s.y2]);}
 pts.forEach(([name,x,y,cls],i)=>{let [sx,sy]=worldToScreen(x,y);let c=el('circle',{cx:sx,cy:sy,r:7,class:'handle '+(cls||''),'data-index':i});c.addEventListener('pointerdown',e=>{e.stopPropagation();dragging=i;svg.setPointerCapture(e.pointerId)});});
 return pts;
}
function render(){
 svg.innerHTML='';drawGrid();drawCurve();const pts=handles();
 const {eq,note}=equation();eqEl.textContent=eq;noteEl.textContent=note;
 listEl.innerHTML=pts.map((p,i)=>`<div class="pointrow"><span>${p[0]}</span><b>(${fmt(p[1])}, ${fmt(p[2])})</b></div>`).join('');
 document.getElementById('scaleLabel').textContent=`Zoom: ${fmt(scale/baseScale)}×`;
}
function pointerPos(e){let r=svg.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function movePoint(i,x,y){
 const s=state,sh=shapeEl.value;
 if(sh==='circle'){if(i===0){s.h=x;s.k=y}else s.r=Math.max(.35,Math.hypot(x-s.h,y-s.k));}
 if(sh==='ellipse'){
  if(i===0){s.h=x;s.k=y}
  else if(i===1)s.a=Math.max(.5,orientation==='horizontal'?Math.abs(x-s.h):Math.abs(y-s.k));
  else s.b=Math.max(.5,orientation==='horizontal'?Math.abs(y-s.k):Math.abs(x-s.h));
  if(s.b>s.a)[s.a,s.b]=[s.b,s.a];
 }
 if(sh==='hyperbola'){
  if(i===0){s.h=x;s.k=y}
  else if(i===1)s.a=Math.max(.5,orientation==='horizontal'?Math.abs(x-s.h):Math.abs(y-s.k));
  else s.b=Math.max(.5,orientation==='horizontal'?Math.abs(y-s.k):Math.abs(x-s.h));
 }
 if(sh==='parabola'){if(i===0){s.h=x;s.k=y}else s.p=Math.max(.4,orientation==='horizontal'?x-s.h:y-s.k);}
 if(sh==='line'){if(i===0){s.x1=x;s.y1=y}else{s.x2=x;s.y2=y}}
}
svg.addEventListener('pointerdown',e=>{if(e.target===svg||e.target.tagName==='line'||e.target.tagName==='path'){panning={x:e.clientX,y:e.clientY,ox,oy};svg.setPointerCapture(e.pointerId)}});
svg.addEventListener('pointermove',e=>{
 const [px,py]=pointerPos(e);
 if(dragging!==null){let [x,y]=screenToWorld(px,py);movePoint(dragging,x,y);render();}
 else if(panning){let r=svg.getBoundingClientRect();ox+= (e.clientX-panning.x)*W/r.width;oy+=(e.clientY-panning.y)*H/r.height;panning.x=e.clientX;panning.y=e.clientY;render();}
});
function stop(){dragging=null;panning=null}
svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
svg.addEventListener('wheel',e=>{e.preventDefault();let [px,py]=pointerPos(e),before=screenToWorld(px,py);scale=Math.max(8,Math.min(120,scale*(e.deltaY<0?1.12:.89)));ox=px-before[0]*scale;oy=py+before[1]*scale;render()},{passive:false});
shapeEl.addEventListener('change',reset);
document.getElementById('horizontal').onclick=()=>{orientation='horizontal';updateButtons();render()};
document.getElementById('vertical').onclick=()=>{orientation='vertical';updateButtons();render()};
document.getElementById('reset').onclick=()=>{scale=baseScale;ox=W/2;oy=H/2;reset()};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(equation().eq);document.getElementById('copy').textContent='Copied!';setTimeout(()=>document.getElementById('copy').textContent='Copy equation',1200)}catch{alert('Copy was blocked by your browser. Select the equation and copy it manually.')}};
reset();
})();
</script>
</body>
</html>
